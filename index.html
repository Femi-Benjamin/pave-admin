    <link rel="icon" type="image/png" href="/pave_logo.png" />
    <link rel="apple-touch-icon" href="/pave_logo.png" />
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem("pave_dark") === "true";
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
